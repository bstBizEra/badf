name: BADF Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python3 scripts/badf_gate.py repo
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate example dossier
        run: python3 scripts/badf_gate.py dossier examples/gate-dossier.G00.json
