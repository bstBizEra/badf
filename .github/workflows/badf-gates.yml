name: BADF Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the monotonic-authority guard compares the candidate
          # matrix against its merge-base with main. A depth-1 checkout has no
          # history to compute one from, and the guard refuses rather than
          # falling back to HEAD (which would compare the change to itself).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate repository contract
        env:
          # The last AUTHORIZED policy, supplied per event so the guard never
          # has to guess. pull_request: the base branch tip. push to main: the
          # tip before this push. Anything else: unset, and the guard resolves
          # merge-base(HEAD, origin/main) or refuses.
          BADF_AUTHORITY_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/badf_gate.py repo
      # QA finding m1: fail-fast hid every violation after the first. Negative
      # control 1 went red at step 4 and steps 5-6 were skipped, so the
      # authority refusal was never exercised and the operator saw one problem
      # per run. Each step now runs regardless; the JOB still fails if any do.
      - name: Run validator tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate example dossier
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/badf_gate.py dossier examples/gate-dossier.G00.json
          python3 scripts/badf_gate.py dossier examples/gate-dossier.G01.json
          python3 scripts/badf_gate.py dossier examples/gate-dossier.G02.json
          python3 scripts/badf_gate.py dossier examples/gate-dossier.G03.json
          python3 scripts/badf_gate.py dossier examples/gate-dossier.G04.json
          python3 scripts/badf_gate.py research examples/research-record.json
          python3 scripts/badf_gate.py research examples/research-record-challenged.json
          python3 scripts/badf_gate.py research examples/research-record-repo.json
          python3 scripts/badf_gate.py research examples/research-record-shadow-control15.json
          python3 scripts/badf_gate.py research examples/research-record-shadow-composed-red.json
          python3 scripts/badf_gate.py research examples/research-record-shadow-ci-parity.json
          python3 scripts/badf_gate.py assure examples/architecture-assurance.json
          python3 scripts/badf_gate.py assure examples/architecture-assurance-shadow-stdlib-compliant.json
          python3 scripts/badf_gate.py assure examples/architecture-assurance-shadow-pyyaml-drift.json
          python3 scripts/badf_gate.py assure examples/architecture-assurance-shadow-indeterminate.json
      - name: PR traceability (Work-Package + Closes #N)
        # BADF-MAIN-001. Only a PR has a body; a push to main has already been
        # traced by the PR that produced it. Reports on the PR event only.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 scripts/check_pr_traceability.py
      - name: Composed-tree verification (the tree that would land)
        # BADF-WP-0024 / #21. PR #30 was green here and its squash turned main
        # red: this runner's origin/main is the PRE-merge ledger. Compose base +
        # head as the squash that would land, with the PR body as its message,
        # point origin/main at it, and run repo + the suite THERE.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 scripts/badf_compose.py --base "$BASE_SHA" --candidate "$HEAD_SHA" --message-file "$RUNNER_TEMP/pr-body.txt"
