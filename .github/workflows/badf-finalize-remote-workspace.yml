name: BADF Finalize Remote Workspace

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: badf-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Finalize registry, integrity lock, and remove this helper
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          skill = Path("skills/badf-git/SKILL.md")
          registry_path = Path("badf/skill-registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          matches = [entry for entry in registry["skills"] if entry.get("name") == "badf-git"]
          if len(matches) != 1:
              raise SystemExit(f"expected one badf-git registry entry, got {len(matches)}")
          entry = matches[0]
          entry["version"] = "0.2.0"
          entry["status"] = "DESIGNED"
          entry["allowed_tools"] = []
          entry["digest"] = "sha256:" + hashlib.sha256(skill.read_bytes()).hexdigest()
          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/badf-finalize-remote-workspace.yml
          python3 scripts/badf_gate.py lock
          python3 -m unittest discover -s tests -p 'test_badf_git_contract.py' -v
          python3 scripts/badf_gate.py repo

          git config user.name "BADF GitHub Remote Workspace"
          git config user.email "badf@bizera.local"
          git add -A
          git commit -m "BADF-WP-0073: finalize remote workspace integrity" -m "Work-Package: WP-2026-0073"

          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$HEAD_REF"
