name: BADF Lock Candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  lock-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Render final registry and integrity candidates
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          skill = Path("skills/badf-git/SKILL.md")
          registry_path = Path("badf/skill-registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          matches = [entry for entry in registry["skills"] if entry.get("name") == "badf-git"]
          if len(matches) != 1:
              raise SystemExit(f"expected one badf-git registry entry, got {len(matches)}")
          entry = matches[0]
          entry["version"] = "0.2.0"
          entry["status"] = "DESIGNED"
          entry["allowed_tools"] = []
          entry["digest"] = "sha256:" + hashlib.sha256(skill.read_bytes()).hexdigest()
          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")
          PY
          python3 scripts/badf_gate.py lock >/dev/null
          python3 - <<'PY'
          import base64
          from pathlib import Path

          for label, path in (
              ("BADF_REGISTRY_B64", Path("badf/skill-registry.json")),
              ("BADF_LOCK_B64", Path("badf/lockfile.json")),
          ):
              print(label + "=" + base64.b64encode(path.read_bytes()).decode("ascii"))
          PY
